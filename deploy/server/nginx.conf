# Home dev server front door -- mounted over loadbalancer/nginx.conf by
# deploy/server/compose.yml, so the laptop stack keeps its own config.
#
#   Cloudflare -> cloudflared -> lb:80 (this file)
#                                  /songforge-audio/*  -> minio:9000
#                                  everything else     -> frontend:3000 (N replicas)
#   frontend -> web:8000 directly (frontend/lib/backend.ts spreads calls over replicas)
#
# This plays the role Railway's edge plays in front of the public frontend service.
# The same front door is published on 127.0.0.1:8080 for k6 (TARGET=edge-origin).

worker_processes auto;

# Connection sizing, set on purpose for held-open SSE streams: each listener holds TWO
# nginx connections (client side + upstream side) for its whole life, so one worker
# holds up to worker_connections / 2 listeners. worker_rlimit_nofile has to cover
# every one of those sockets (plus log files), or accept()/connect() fails with EMFILE.
worker_rlimit_nofile 65536;

events {
  worker_connections 16384;
}

http {
  # Re-resolve service names every 10s via Docker's embedded DNS, so a `--scale`d or
  # restarted replica is picked up. Only takes effect because proxy_pass uses variables.
  resolver 127.0.0.11 valid=10s;

  # Busy load tests make thousands of requests a second; keep the access log but buffer
  # it so logging is not what limits the run.
  access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

  server {
    listen 80;

    location = /lb-health {
      access_log off;
      return 200 "ok\n";
    }

    # Audio playback, seeking (Range) and presigned downloads, straight from MinIO.
    location /songforge-audio/ {
      set $upstream_minio minio:9000;
      proxy_pass http://$upstream_minio;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Presigned download signatures cover the host the browser used (dev.<domain>),
      # so pass it through exactly, port included.
      proxy_set_header Host $http_host;
      # Stream MP3s instead of spooling them to nginx temp files.
      proxy_buffering off;
      proxy_request_buffering off;
      client_max_body_size 0;
    }

    location / {
      set $upstream_frontend frontend:3000;
      proxy_pass http://$upstream_frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite, never append (see loadbalancer/nginx.conf). Behind the tunnel the TCP
      # peer is cloudflared; Cloudflare's CF-Connecting-IP passes through untouched.
      # (The frontend does not yet forward a client IP to web; rate limits are off here.)
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SSE: no buffering, and a read timeout far above the 30s heartbeat.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      # Retry another frontend replica only when the first gave no response at all;
      # nginx never replays a POST unless `non_idempotent` is listed.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
