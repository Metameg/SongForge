[project]
name = "songforge"
version = "0.1.0"
description = "SongForge — synchronized prompt-fed global radio (greenfield rebuild)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "boto3>=1.35",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "mutagen>=1.47",
    # Runtime HTTP client — the simulator POSTs completion webhooks with it (issue #11).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "moto[s3]>=5.0",
]

[project.scripts]
songforge-web = "songforge.web.__main__:main"
songforge-worker = "songforge.worker.__main__:main"
songforge-boot = "songforge.boot:main"
# Dev/test-only fault-injectable MusicGPT simulator (issue #11); never run in prod.
songforge-simulator = "songforge.simulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live Postgres/Redis/MinIO (skipped when unavailable)",
]

[tool.mypy]
python_version = "3.12"
packages = ["songforge"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
