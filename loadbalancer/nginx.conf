# Load balancer in front of the `web` service (issue #19, PRD #6 AC#1: stateless
# app tier scales horizontally behind a load balancer). Mounted read-only into the
# `lb` service in docker-compose.yml, mirroring the repo's existing mounted-config
# convention for Prometheus/Grafana (see monitoring/).
#
# Stateless upstream: `web` carries no session state (identity is a signed cookie,
# the radio pointer lives in Redis/Postgres, not process memory), so ANY replica
# can serve ANY request -- no sticky sessions / IP-hash needed here.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS server (127.0.0.11) round-robins the A-records for a
  # scaled service name (`web`) across all of its replicas. nginx resolves a
  # static `proxy_pass http://web:8000;` upstream ONCE at startup and caches
  # that resolution for the life of the worker process -- scaling `web` up or
  # down with `docker compose up --scale web=N` after `lb` is already running
  # would silently never be picked up (nginx keeps hammering whichever
  # container IPs it saw at its own boot time). Using a *variable* in
  # `proxy_pass` forces nginx to consult the resolver (and therefore Docker
  # DNS) again every `valid` seconds instead of caching forever.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location / {
      set $upstream_web web:8000;
      proxy_pass http://$upstream_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Security Phase-5 fix (HIGH): OVERWRITE, never APPEND. $proxy_add_x_forwarded_for
      # would concatenate whatever XFF value the client already sent with our own
      # $remote_addr, and the app trusts the LEFTMOST token as the client IP
      # (web/identity.py::client_ip) -- so an appended header lets any client forge an
      # arbitrary leftmost IP and dodge the per-IP rate cap entirely. Because this is the
      # single trusted hop into the stack (nginx is the actual TCP peer of every
      # upstream connection), overwriting with $remote_addr is both safe and correct:
      # whatever the client sent is discarded, and the app's existing leftmost-token read
      # (config.py: CLIENT_IP_HEADER=X-Forwarded-For, set on the web service below) now
      # sees only the real peer. Never change this back to $proxy_add_x_forwarded_for
      # without also changing the app to read the RIGHTMOST N trusted hops instead.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Issue #10 (SSE push): disable response buffering and use a long read
      # timeout, or nginx would buffer/chunk the event stream and eventually
      # cut an idle-but-alive long-lived connection.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Connection "";
      # Quality Phase-5 fix (MINOR): retry another `web` replica if the one nginx picked
      # is mid-restart (killed/still coming up between `docker stop` and the resolver's
      # next 10s DNS refresh) rather than surfacing a hard error to the client. Scoped to
      # error/timeout/5xx only (never on a successful-but-slow response) so a legitimate
      # in-flight POST (e.g. `/api/create`) is never silently replayed against a second
      # replica after it already reached the app -- nginx only retries a request that
      # never got a response out of the FIRST upstream at all. Compose-local concern only:
      # Railway's own edge LB handles this in prod (see docs/deploy.md).
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    # Security Phase-5 fix (MEDIUM): block the Prometheus registry at the public edge.
    # Prometheus scrapes `web:8000/metrics` directly over the compose network (see
    # monitoring/prometheus/prometheus.yml) -- it never goes through this load balancer,
    # so blocking the route here does not affect scraping. Left reachable, anyone hitting
    # the public LB could read internal cardinality (queue depths, job/generation counts,
    # per-route latency, label values) -- reconnaissance/abuse-probing material. The PRD's
    # "/metrics always-on" intent is about the endpoint always existing on `web`, not
    # about it being world-readable through the public ingress.
    location = /metrics {
      deny all;
      return 403;
    }
  }
}
